{% set name = "gsl" %}
{% set version = "2.7.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: http://ftp.gnu.org/gnu/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: dcb0fbd43048832b757ff9942691a8dd70026d5da0ff85601e52687f6deeb34b
  patches:  # [win]
    - patch_for_windows.patch        # [win]
    - tt.patch  # [win]
    # diff from source distribution to https://github.com/ampl/gsl/tree/v2.4.0
    - patch_cmake_for_windows.patch  # [win]
    # avoid "make check" error: https://savannah.gnu.org/bugs/?52927
    # - bessel_test.diff

build:
  number: 2
  run_exports:
    # tends to break at minor revs
    #    https://abi-laboratory.pro/index.php?view=timeline&l=gsl
    - {{ pin_subpackage("gsl", max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler("c") }}
    - cmake  # [win]
    - make   # [not win]
    - libtool  # [not win]
  host:
    - openblas-devel {{ openblas }}  # [blas_implementation == 'openblas']
test:
  requires:
    - conda-build  # [not win]
  commands:
    - gsl-config --prefix  # [not win]
    - if not exist %LIBRARY_LIB%\\gsl.lib       exit 1   # [win]
    - if not exist %LIBRARY_LIB%\\gslcblas.lib  exit 1   # [win]
    - if not exist %LIBRARY_BIN%\\gsl.dll       exit 1   # [win]
    - conda inspect linkages -p $PREFIX $PKG_NAME  # [not win]
    - conda inspect objects -p $PREFIX $PKG_NAME  # [osx]

about:
  home: https://www.gnu.org/software/gsl
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  summary: GNU Scientific Library
  dev_url: https://git.savannah.gnu.org/cgit/gsl.git
  doc_url: https://www.gnu.org/software/gsl/doc/html/index.html

extra:
  recipe-maintainers:
    - kwilcox
    - mingwandroid
    - ocefpaf
